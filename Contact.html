<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DogAdopt — Contact</title>

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  
  <!-- Homepage-only CSS -->
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="contact.css" />
  <link rel="stylesheet" href="responsive.css" />
</head>
<body class="contact">
  <!-- ===== Header ===== -->
  <header class="contact-header" data-site-header>
    <div class="contact-container contact-header__inner">
      <a class="contact-brand" href="HomePage.html">
        <span class="contact-brand__icon"><i class="fa fa-paw"></i></span>
        <span class="contact-brand__name">DogAdopt</span>
      </a>

      <nav class="contact-nav" id="site-navigation" aria-label="Primary">
        <a href="HomePage.html" class="contact-nav__link">Home</a>
        <a href="AboutUs.html" class="contact-nav__link">About</a>
        <a href="dogs.html" class="contact-nav__link">Dogs</a>
        <a href="#" class="contact-nav__link">Adopt</a>
        <a href="Contact.html" class="contact-nav__link is-active" aria-current="page">Contact</a>
      </nav>

      <div class="contact-header__cta" id="site-account-links">
        <a class="contact-btn contact-btn--outline" href="login.html">Log in</a>
        <a class="contact-btn" href="SignUp.html">Sign up</a>
      </div>

      <button class="contact-nav__toggle" type="button" data-menu-toggle aria-label="Open menu" aria-expanded="false" aria-controls="site-navigation site-account-links">
        <i class="fa fa-bars" aria-hidden="true"></i><span>Menu</span>
      </button>
    </div>
  </header>

  <main class="contact-main">
    <!-- ===== Contact Section ===== -->
    <section class="contact-section">
      <div class="contact-container">
        <div class="contact-section__head">
          <h1 class="contact-section__title">Get in Touch</h1>
          <p class="contact-section__subtitle">We'd love to hear from you. Please fill out the form below.</p>
        </div>

        <div class="contact-form-container">
          <form class="contact-form">
            <div class="contact-form__group">
              <label for="name" class="contact-form__label">Name</label>
              <input type="text" id="name" name="name" class="contact-form__input" placeholder="Your Name" required>
            </div>
            <div class="contact-form__group">
              <label for="email" class="contact-form__label">Email</label>
              <input type="email" id="email" name="email" class="contact-form__input" placeholder="Your Email" required>
            </div>
            <div class="contact-form__group">
              <label for="message" class="contact-form__label">Message</label>
              <textarea id="message" name="message" class="contact-form__textarea" placeholder="Your Message" required></textarea>
            </div>
            <button type="submit" class="contact-btn contact-btn--lg">Send Message</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <!-- ===== Footer ===== -->
  <footer class="contact-footer">
    <div class="contact-container contact-footer__inner">
      <p class="contact-footer__copy">© <span id="contact-year"></span> DogAdopt</p>
      <nav class="contact-footer__nav" aria-label="Footer">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="Contact.html">Contact</a>
      </nav>
      <div class="contact-footer__social">
        <span class="contact-paw-circle contact-paw--orange" aria-label="Instagram"><i class="fa fa-paw"></i></span>
        <span class="contact-paw-circle contact-paw--orange2" aria-label="Twitter/X"><i class="fa fa-paw"></i></span>
        <span class="contact-paw-circle contact-paw--green" aria-label="Facebook"><i class="fa fa-paw"></i></span>
      </div>
    </div>
  </footer>

  <script>
    document.getElementById('contact-year').textContent = new Date().getFullYear();
  </script>
  <script src="navigation.js"></script>
</body>
</html>
