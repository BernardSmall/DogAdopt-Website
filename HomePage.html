<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DogAdopt — Home</title>

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  
  <!-- Homepage-only CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="home">
  <!-- ===== Header ===== -->
  <header class="home-header">
    <div class="home-container home-header__inner">
      <a class="home-brand" href="#">
        <span class="home-brand__icon"><i class="fa fa-paw"></i></span>
        <span class="home-brand__name">DogAdopt</span>
      </a>

      <nav class="home-nav" aria-label="Primary">
        <a href="#" class="home-nav__link is-active">Home</a>
        <a href="#" class="home-nav__link">About</a>
        <a href="#" class="home-nav__link">Dogs</a>
        <a href="#" class="home-nav__link">Adopt</a>
        <a href="#" class="home-nav__link">Contact</a>
      </nav>

      <div class="home-header__cta">
        <a class="home-btn home-btn--outline" href="#">Sign in</a>
        <a class="home-btn" href="#">Sign up</a>
      </div>

      <button class="home-nav__toggle" aria-label="Open menu">
        <i class="fa fa-bars"></i>
      </button>
    </div>
  </header>

  <main class="home-main">
    <!-- ===== Hero ===== -->
    <section class="home-hero">
      <div class="home-container home-hero__inner">
        <div class="home-hero__text">
          <h1 class="home-hero__title">Find Your New Best Friend</h1>
          <p class="home-hero__subtitle">
            Browse loving dogs waiting for a forever home. Simple process, friendly support.
          </p>
          <div class="home-hero__actions">
            <a class="home-btn home-btn--lg" href="#">Adopt now</a>
            <a class="home-btn home-btn--ghost home-btn--lg" href="#">See available dogs</a>
          </div>
        </div>

        <div class="home-hero__art" aria-hidden="true">
          <!-- Replace the three paw circles with one image -->
          <img src="Photos/DogHouse2.png" alt="Dog House" class="home-hero__image" />
        </div>
      </div>
    </section>

    <!-- ===== Featured Dogs ===== -->
    <section class="home-section home-section--dogs">
      <div class="home-container">
        <div class="home-section__head">
          <h2 class="home-section__title">Featured Dogs</h2>
          <a class="home-link" href="#">View all <i class="fa fa-arrow-right"></i></a>
        </div>

        <!-- Dog Cards Section (will be dynamically populated) -->
        <div class="home-dogs" id="dog-cards-container"></div>
      </div>
    </section>
  </main>

  <!-- ===== Footer ===== -->
  <footer class="home-footer">
    <div class="home-container home-footer__inner">
      <p class="home-footer__copy">© <span id="home-year"></span> DogAdopt</p>
      <nav class="home-footer__nav" aria-label="Footer">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Contact</a>
      </nav>
      <div class="home-footer__social">
        <span class="home-paw-circle home-paw--orange" aria-label="Instagram"><i class="fa fa-paw"></i></span>
        <span class="home-paw-circle home-paw--orange2" aria-label="Twitter/X"><i class="fa fa-paw"></i></span>
        <span class="home-paw-circle home-paw--green" aria-label="Facebook"><i class="fa fa-paw"></i></span>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
